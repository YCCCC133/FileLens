<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>文件搜索器正在启动</title><style>
:root{color-scheme:dark light;
--bg:#f5f5f7;--glass:rgba(255,255,255,.62);--hair:rgba(0,0,0,.09);
--text:#1d1d1f;--sub:#6e6e73;--muted:#aeaeb2;--accent:#007aff}
@media(prefers-color-scheme:dark){:root{
--bg:#1a1a1c;--glass:rgba(40,40,44,.55);--hair:rgba(255,255,255,.1);
--text:#f5f5f7;--sub:#98989d;--muted:#636366;--accent:#0a84ff}}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:var(--bg);color:var(--text);
font:15px -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--bg)}
.appmark{width:56px;height:56px;margin:0 auto 24px;display:grid;place-items:center;border-radius:14px;
color:#fff;background:linear-gradient(180deg,#3b9cff,#087bf5);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.4),0 5px 16px rgba(0,82,180,.25)}
.appmark svg{width:30px;height:30px}
.card{width:min(440px,calc(100% - 48px));padding:38px 40px;border:1px solid var(--hair);
border-radius:16px;background:var(--glass);backdrop-filter:blur(28px) saturate(180%);
-webkit-backdrop-filter:blur(28px) saturate(180%);box-shadow:0 12px 40px rgba(0,0,0,.10);text-align:center}
@media(prefers-color-scheme:dark){.card{box-shadow:0 12px 40px rgba(0,0,0,.38)}}
.spin{width:34px;height:34px;border:3px solid var(--hair);border-top-color:var(--accent);border-radius:50%;
animation:r .8s linear infinite;margin:0 auto}@keyframes r{to{transform:rotate(360deg)}}
h1{font-size:19px;margin:22px 0 10px;letter-spacing:-.01em;font-weight:700}
p{color:var(--sub);line-height:1.75;margin:0;font-size:13.5px}
.hint{margin-top:16px;font-size:12.5px;color:var(--muted)}
</style></head><body><main class="card"><div class="appmark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4"/></svg></div><div class="spin"></div><h1>正在准备文件搜索器</h1>
<p>程序在后台启动，不会打开命令行窗口。首次在这台电脑使用时会建立本机高速索引，完成后本页自动进入搜索。</p>
<p class="hint" id="hint">正在连接本地服务…</p></main><script>
let attempts=0;async function ready(){attempts++;for(let port=8765;port<8785;port++){try{await fetch(`http://127.0.0.1:${port}/api/stats`,{mode:"no-cors",cache:"no-store"});location.replace(`http://127.0.0.1:${port}/`);return}catch(e){}}document.getElementById("hint").textContent=attempts<15?"正在连接本地服务…":"首次索引可能需要几分钟，请保持本页打开。";setTimeout(ready,1500)}ready();
</script></body></html>
